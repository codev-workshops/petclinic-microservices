# Unified Docker Compose for Spring PetClinic Microservices.
#
# Build the jars, then build and start everything:
#   ./mvnw clean package -DskipTests && docker compose up -d --build
# (or build the images with `./mvnw clean install -P buildDocker` and run `docker compose up -d`)
#
# The nginx reverse proxy is the single entry point (http://localhost by default, see PROXY_PORT):
#   /            PetClinic UI and REST API (api-gateway)
#   /admin/      Spring Boot Admin
#   /eureka/     Eureka dashboard (redirects to /eureka-dashboard)
#   /zipkin/     Zipkin tracing UI
#   /grafana/    Grafana
#   /prometheus/ Prometheus
#
# Networks:
#   edge     - reverse proxy and the services it exposes
#   backend  - inter-service traffic (config, discovery, business services, tracing, metrics)
# Use docker-compose.debug.yml to also publish each service port on the host.

x-spring-service: &spring-service
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 512M
  networks:
    - backend
  depends_on: &spring-service-depends-on
    config-server:
      condition: service_healthy
    discovery-server:
      condition: service_healthy

x-eureka-client-env: &eureka-client-env
  SPRING_PROFILES_ACTIVE: docker
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
  EUREKA_CLIENT_REGISTRYFETCHINTERVALSECONDS: 5
  EUREKA_INSTANCE_LEASERENEWALINTERVALINSECONDS: 10
  MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://tracing-server:9411/api/v2/spans

x-spring-healthcheck: &spring-healthcheck
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 60s
  start_interval: 2s

services:
  config-server:
    image: springcommunity/spring-petclinic-config-server
    build: &spring-build
      context: ./spring-petclinic-config-server/target
      dockerfile: ../../docker/Dockerfile
    container_name: config-server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - backend
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8888/actuator/health"]

  discovery-server:
    image: springcommunity/spring-petclinic-discovery-server
    build:
      <<: *spring-build
      context: ./spring-petclinic-discovery-server/target
    container_name: discovery-server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Outside /eureka/*, which is owned by the Eureka REST API (Jersey)
      EUREKA_DASHBOARD_PATH: /eureka-dashboard
      EUREKA_SERVER_RESPONSECACHEUPDATEINTERVALMS: 5000
    networks:
      - backend
      - edge
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8761/actuator/health"]
    depends_on:
      config-server:
        condition: service_healthy

  customers-service:
    <<: *spring-service
    image: springcommunity/spring-petclinic-customers-service
    build:
      <<: *spring-build
      context: ./spring-petclinic-customers-service/target
    container_name: customers-service
    environment:
      <<: *eureka-client-env
      SERVER_PORT: 8081
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8081/actuator/health"]

  visits-service:
    <<: *spring-service
    image: springcommunity/spring-petclinic-visits-service
    build:
      <<: *spring-build
      context: ./spring-petclinic-visits-service/target
    container_name: visits-service
    environment:
      <<: *eureka-client-env
      SERVER_PORT: 8082
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8082/actuator/health"]

  vets-service:
    <<: *spring-service
    image: springcommunity/spring-petclinic-vets-service
    build:
      <<: *spring-build
      context: ./spring-petclinic-vets-service/target
    container_name: vets-service
    environment:
      <<: *eureka-client-env
      SERVER_PORT: 8083
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8083/actuator/health"]

  genai-service:
    <<: *spring-service
    image: springcommunity/spring-petclinic-genai-service
    build:
      <<: *spring-build
      context: ./spring-petclinic-genai-service/target
    container_name: genai-service
    environment:
      <<: *eureka-client-env
      SERVER_PORT: 8084
      OPENAI_API_KEY: ${OPENAI_API_KEY:-demo}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8084/actuator/health"]

  api-gateway:
    <<: *spring-service
    image: springcommunity/spring-petclinic-api-gateway
    build:
      <<: *spring-build
      context: ./spring-petclinic-api-gateway/target
    container_name: api-gateway
    environment:
      <<: *eureka-client-env
      SERVER_PORT: 8080
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    networks:
      - backend
      - edge
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/actuator/health"]
    depends_on:
      <<: *spring-service-depends-on
      customers-service:
        condition: service_healthy
      visits-service:
        condition: service_healthy
      vets-service:
        condition: service_healthy

  admin-server:
    <<: *spring-service
    image: springcommunity/spring-petclinic-admin-server
    build:
      <<: *spring-build
      context: ./spring-petclinic-admin-server/target
    container_name: admin-server
    environment:
      <<: *eureka-client-env
      SERVER_PORT: 9090
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_BOOT_ADMIN_CONTEXT_PATH: /admin
    networks:
      - backend
      - edge
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9090/actuator/health"]

  tracing-server:
    image: openzipkin/zipkin
    container_name: tracing-server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      # The image's docker-healthcheck uses `hostname -i`, which returns one IP per network
      HEALTHCHECK_IP: 127.0.0.1
    networks:
      - backend
      - edge
    healthcheck:
      test: ["CMD", "docker-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s

  ## Grafana / Prometheus

  grafana-server:
    build: ./docker/grafana
    container_name: grafana-server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      # Must match the proxy port the browser uses, or Grafana-built absolute URLs point at the wrong address
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:${PROXY_PORT:-80}/grafana/"
    networks:
      - edge
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s
    depends_on:
      prometheus-server:
        condition: service_healthy

  prometheus-server:
    build: ./docker/prometheus
    container_name: prometheus-server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.external-url=/prometheus/
    networks:
      - backend
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/prometheus/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s

  ## Reverse proxy (single entry point)

  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: reverse-proxy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - ${PROXY_PORT:-80}:80
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 2s
    depends_on:
      api-gateway:
        condition: service_healthy
      admin-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      tracing-server:
        condition: service_healthy
      grafana-server:
        condition: service_healthy
      prometheus-server:
        condition: service_healthy

networks:
  edge:
    name: petclinic-edge
  backend:
    name: petclinic-backend
