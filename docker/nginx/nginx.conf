worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_user_agent" upstream=$upstream_addr rt=$request_time';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # Docker embedded DNS: resolve upstreams at request time so the proxy survives
    # container restarts / IP changes and can start before every upstream is up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    proxy_http_version 1.1;
    # $http_host keeps the client-facing port (PROXY_PORT), so upstreams build URLs that point back at the proxy
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;

    server {
        listen 80 default_server;
        server_name _;
        # Relative Location headers, so nginx redirects keep whatever host port PROXY_PORT publishes
        absolute_redirect off;

        set $api_gateway   api-gateway:8080;
        set $admin_server  admin-server:9090;
        set $discovery     discovery-server:8761;
        set $zipkin        tracing-server:9411;
        set $grafana       grafana-server:3000;
        set $prometheus    prometheus-server:9090;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        # Spring Boot Admin (served under /admin via spring.boot.admin.context-path)
        location = /admin/ {
            return 302 /admin;
        }
        location /admin {
            proxy_pass http://$admin_server;
            # Server-sent events used by the admin UI
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        # Eureka dashboard (eureka.dashboard.path=/eureka-dashboard) and its static assets.
        # The Eureka REST API (/eureka/apps, ...) is intentionally not exposed.
        location = /eureka/ {
            return 302 /eureka-dashboard;
        }
        location /eureka-dashboard {
            proxy_pass http://$discovery;
        }
        location ~ ^/eureka/(css|js|fonts|images)/ {
            proxy_pass http://$discovery;
        }
        location /eureka/ {
            return 404;
        }

        # Zipkin UI and its API (served under /zipkin natively)
        location /zipkin/ {
            proxy_pass http://$zipkin;
        }

        # Grafana 5.x does not serve from a sub path itself: strip the prefix
        location /grafana/ {
            rewrite ^/grafana/(.*)$ /$1 break;
            proxy_pass http://$grafana;
        }

        # Prometheus (--web.external-url=/prometheus/)
        location /prometheus/ {
            proxy_pass http://$prometheus;
        }

        # Actuator endpoints of the gateway are internal only
        location /actuator {
            return 404;
        }

        # PetClinic UI + REST API through Spring Cloud Gateway
        location / {
            proxy_pass http://$api_gateway;
        }
    }
}
