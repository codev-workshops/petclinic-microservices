apiVersion: apps/v1
kind: Deployment
metadata:
  name: customers-service
  labels:
    app: customers-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customers-service
  template:
    metadata:
      labels:
        app: customers-service
    spec:
      # Optional: reduces crash-loops by waiting for config-server before the JVM
      # starts. Readiness probes + restart backoff remain the primary ordering
      # mechanism; this is just a courtesy wait.
      initContainers:
        - name: wait-for-config-server
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              until curl -sf -o /dev/null "$CONFIG_SERVER_URL"; do
                echo "waiting for config-server..."; sleep 5;
              done
          env:
            - name: CONFIG_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: petclinic-config
                  key: CONFIG_SERVER_URL
      containers:
        - name: customers-service
          image: springcommunity/spring-petclinic-customers-service:latest
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: petclinic-config
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
