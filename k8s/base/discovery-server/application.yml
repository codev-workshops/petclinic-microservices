# discovery-server (Eureka service registry): Kubernetes-specific properties.
# Mounted at /etc/petclinic/config and loaded via SPRING_CONFIG_ADDITIONAL_LOCATION;
# overrides the Config Server values (the config repo sets spring.cloud.config.override-none=true).
spring:
  config:
    import: configserver:${CONFIG_SERVER_URL:http://config-server:8888}
server:
  port: 8761
  shutdown: graceful
eureka:
  instance:
    hostname: discovery-server
  # Standalone registry
  client:
    registerWithEureka: false
    fetchRegistry: false
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoint:
    health:
      # /actuator/health/liveness and /actuator/health/readiness, used by the Deployment probes
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        # The shared config repo exposes '*'; only expose what Kubernetes and Prometheus need
        include: health,info,prometheus,metrics
