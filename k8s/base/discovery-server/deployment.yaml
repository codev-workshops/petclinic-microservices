apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  labels:
    app.kubernetes.io/name: discovery-server
    app.kubernetes.io/component: infrastructure
spec:
  # replicas is owned by the HorizontalPodAutoscaler
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: discovery-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discovery-server
        app.kubernetes.io/component: infrastructure
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8761"
    spec:
      terminationGracePeriodSeconds: 45
      # Resolve A/AAAA sequentially: parallel lookups on one socket can hit a conntrack race under
      # NetworkPolicy enforcement (seen with kindnet), making the JVM fail with UnknownHostException.
      dnsConfig:
        options:
          - name: single-request-reopen
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The docker profile makes the Config Server import mandatory; wait for it instead of crash-looping
        - name: wait-for-config-server
          image: busybox:1.36
          command:
            - sh
            - -c
            - until wget -q -O /dev/null http://config-server:8888/actuator/health/readiness; do echo waiting for config-server; sleep 3; done
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: discovery-server
          image: springcommunity/spring-petclinic-discovery-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8761
              protocol: TCP
          envFrom:
            - configMapRef:
                name: petclinic-env
          env:
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: optional:file:/etc/petclinic/config/
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
          # Spring Boot actuator health groups; startupProbe covers slow JVM + config fetch startup
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # Let endpoints and Eureka clients drop the pod before graceful shutdown starts
            preStop:
              exec:
                command: ["sleep", "10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/petclinic/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: discovery-server-config
        - name: tmp
          emptyDir: {}
