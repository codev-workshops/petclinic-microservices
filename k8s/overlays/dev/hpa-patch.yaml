# Dev: one replica of everything, small headroom to exercise autoscaling.
# The backend services use an in-memory HSQLDB per pod in dev, so extra customers/visits replicas
# do not share data; use the prod overlay (MySQL) when you need consistent multi-replica writes.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: config-server
spec:
  minReplicas: 1
  maxReplicas: 1
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
spec:
  minReplicas: 1
  maxReplicas: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: customers-service
spec:
  minReplicas: 1
  maxReplicas: 2
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: visits-service
spec:
  minReplicas: 1
  maxReplicas: 2
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vets-service
spec:
  minReplicas: 1
  maxReplicas: 2
