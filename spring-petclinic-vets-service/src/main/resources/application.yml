spring:
  application:
    name: vets-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888/}
  cache:
    cache-names: vets
  profiles:
    active: production

logging:
  structured:
    format:
      console: ecs

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState

---
spring:
  config:
    activate:
      on-profile: docker
    import: configserver:http://config-server:8888
