spring:
  application:
    name: admin-server
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888/}

management:
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,discoveryComposite


---
spring:
  config:
    activate:
      on-profile: docker
    import: configserver:http://config-server:8888
